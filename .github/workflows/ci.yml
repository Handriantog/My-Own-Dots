name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      conversations:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: dots
          POSTGRES_PASSWORD: dots-ci
          POSTGRES_DB: dots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dots -d dots_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LOCAL_TEST_DATABASE_URL: postgresql://dots:dots-ci@127.0.0.1:5432/dots_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.6'
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup:llm
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
