<svg id="how-a-dot-turns-a-request-into-an-action" xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-labelledby="how-a-dot-turns-a-request-into-an-action-title"><title id="how-a-dot-turns-a-request-into-an-action-title">How a Dot turns a request into an action</title><defs><marker id="how-a-dot-turns-a-request-into-an-action-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#637386"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17283c}.title{font-size:17px;font-weight:600}.body{font-size:14px}.label{font-size:13px;fill:#516277}#how-a-dot-turns-a-request-into-an-action .arrow{fill:none;stroke:#637386;stroke-width:1.7;marker-end:url(#how-a-dot-turns-a-request-into-an-action-arrow)}.heading{font-size:26px;font-weight:600}.sub{font-size:15px;fill:#516277}</style><rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="45" class="heading">Legacy Dot runtime before Codex execution</text>
<text x="40" y="74" class="sub">Historical investigation · See 2026-10-25-codex-voice-design.md for the implemented Codex flow.</text>
<g><rect x="40" y="110" width="370" height="130" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="58" y="140" class="title">Text · Basic / Medium voice</text><text x="58" y="168" class="body">Chat, or speech → transcript</text><text x="58" y="190" class="body">Same DotAgent tools and approvals</text><text x="58" y="212" class="body">Medium adds generated speech</text></g>
<g><rect x="455" y="110" width="370" height="130" rx="15" fill="#fff2dd" stroke="#cbd4dd"/><text x="473" y="140" class="title">High local voice</text><text x="473" y="168" class="body">Qwen routes each utterance</text><text x="473" y="190" class="body">Tasks → linked DotAgent conversation</text><text x="473" y="212" class="body">Small talk → local reply; no actions</text></g>
<g><rect x="870" y="110" width="370" height="130" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="888" y="140" class="title">Optional paid Realtime</text><text x="888" y="168" class="body">Separate speech / conversation path</text><text x="888" y="190" class="body">Task handoff uses server tools</text><text x="888" y="212" class="body">Requires separate configuration</text></g>
<path d="M225 240 V285 H205 V325" class="arrow"/><path d="M640 240 V273 H205 V325" class="arrow"/><text x="350" y="265" class="label">task delegation</text><path d="M1055 240 V295 H205 V325" class="arrow"/>
<g><rect x="40" y="325" width="330" height="150" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="58" y="355" class="title">DotAgent + TanStack loop</text><text x="58" y="383" class="body">Load conversation, Dot and memory</text><text x="58" y="405" class="body">Select permitted tools for this turn</text><text x="58" y="427" class="body">Track cancellation and approvals</text><text x="58" y="449" class="body">Default: 5 iterations, 90 s total</text></g>
<g><rect x="475" y="325" width="330" height="150" rx="15" fill="#f2eefe" stroke="#cbd4dd"/><text x="493" y="355" class="title">MyOwnLlmIntegrator</text><text x="493" y="383" class="body">Serialize history + tool schemas</text><text x="493" y="405" class="body">Authenticated subscription CLI</text><text x="493" y="427" class="body">Inference-only mode: native CLI</text><text x="493" y="449" class="body">shell / browser / tools disabled</text></g>
<g><rect x="910" y="325" width="330" height="150" rx="15" fill="#f2eefe" stroke="#cbd4dd"/><text x="928" y="355" class="title">Configured subscription LLM</text><text x="928" y="383" class="body">Receives selected prompt context</text><text x="928" y="405" class="body">Returns text + requested tool calls</text><text x="928" y="427" class="body">Cannot act on the desktop directly</text><text x="928" y="449" class="body">Provider inference is not local</text></g>
<path d="M370 390 H475" class="arrow"/><text x="402" y="378" class="label">request</text><path d="M805 390 H910" class="arrow"/><text x="836" y="378" class="label">prompt</text>
<g><rect x="910" y="525" width="330" height="104" rx="15" fill="#f2eefe" stroke="#cbd4dd"/><text x="928" y="555" class="title">Structured decision</text><text x="928" y="583" class="body">Text + exact tool name + JSON args</text><text x="928" y="605" class="body">A proposed action is not evidence</text></g>
<g><rect x="475" y="525" width="330" height="104" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="493" y="555" class="title">Host validation</text><text x="493" y="583" class="body">Check tool name, schema and scope</text><text x="493" y="605" class="body">Run only under current authority</text></g>
<g><rect x="40" y="525" width="330" height="104" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="58" y="555" class="title">Evidence back to the model</text><text x="58" y="583" class="body">Actual outcome, error or uncertainty</text><text x="58" y="605" class="body">Repeat reasoning or finish reply</text></g>
<path d="M1075 475 V525" class="arrow"/><path d="M910 577 H805" class="arrow"/><path d="M475 577 H370" class="arrow"/><text x="403" y="563" class="label">result</text><path d="M205 525 V475" class="arrow"/><text x="220" y="504" class="label">next step</text>
<g><rect x="475" y="682" width="330" height="77" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="493" y="712" class="title">Authorized tool dispatch</text><text x="493" y="740" class="body">Approval pauses and later resumes</text></g>
<path d="M640 629 V682" class="arrow"/>
<g><rect x="40" y="830" width="275" height="180" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="58" y="860" class="title">Application tools</text><text x="58" y="888" class="body">Pages, memory, websites</text><text x="58" y="910" class="body">Task scheduling and research</text><text x="58" y="932" class="body">Read-only runtime diagnostics</text><text x="58" y="954" class="body">Server-owned operations</text></g>
<g><rect x="350" y="830" width="275" height="180" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="368" y="860" class="title">Local folder tools</text><text x="368" y="888" class="body">Request → native folder picker</text><text x="368" y="910" class="body">Choose → inspect → approve</text><text x="368" y="932" class="body">Grant ID + relative path only</text><text x="368" y="954" class="body">Read/write files; no host shell</text></g>
<g><rect x="660" y="830" width="275" height="180" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="678" y="860" class="title">Installed Abilities</text><text x="678" y="888" class="body">Per-Dot and master switches</text><text x="678" y="910" class="body">Desktop bridge → sealed worker</text><text x="678" y="932" class="body">Declared capability broker</text><text x="678" y="954" class="body">Native app / pointer helpers</text></g>
<g><rect x="970" y="830" width="270" height="180" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="988" y="860" class="title">Optional services</text><text x="988" y="888" class="body">MCP / connected apps</text><text x="988" y="910" class="body">Approval for gated actions</text><text x="988" y="932" class="body">OpenBot browser/files/shell</text><text x="988" y="954" class="body">Separate isolated computer</text></g>
<path d="M640 759 V792 H178 V830" class="arrow"/><path d="M640 759 V792 H488 V830" class="arrow"/><path d="M640 759 V792 H798 V830" class="arrow"/><path d="M640 759 V792 H1105 V830" class="arrow"/>
<path d="M488 1010 V1040 H178" class="arrow"/><path d="M798 1010 V1040 H488" class="arrow"/><path d="M1105 1010 V1040 H798" class="arrow"/><path d="M178 1010 V1040 H20 V577 H40" class="arrow"/><text x="40" y="1062" class="label">execution results</text>
<text x="350" y="1060" class="sub">Local persistence: workspace SQLite + conversation SQLite or PostgreSQL</text>
<text x="350" y="1087" class="sub">Private Ability content stays in owner cards; trusted activity status can reach the model.</text>
</svg>