<svg id="folder-permission-selection-and-approval-flow" xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="folder-permission-selection-and-approval-flow-title"><title id="folder-permission-selection-and-approval-flow-title">Folder permission selection and approval flow</title><defs><marker id="folder-permission-selection-and-approval-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#637386"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17283c}.title{font-size:17px;font-weight:600}.body{font-size:14px}.label{font-size:13px;fill:#516277}#folder-permission-selection-and-approval-flow .arrow{fill:none;stroke:#637386;stroke-width:1.7;marker-end:url(#folder-permission-selection-and-approval-flow-arrow)}.heading{font-size:26px;font-weight:600}.sub{font-size:15px;fill:#516277}</style><rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="45" class="heading">Choosing a folder proposes access; approval grants it</text>
<text x="40" y="75" class="sub">A previous folder name is not evidence that it contains the code for the current problem.</text>
<g><rect x="40" y="120" width="270" height="140" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="58" y="150" class="title">Request</text><text x="58" y="178" class="body">Reason + least access needed</text><text x="58" y="200" class="body">Use exact owner-provided path</text><text x="58" y="222" class="body">No path given → empty hint</text></g>
<g><rect x="350" y="120" width="270" height="140" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="368" y="150" class="title">Choose folder</text><text x="368" y="178" class="body">Native macOS picker</text><text x="368" y="200" class="body">Pause approval feed refresh</text><text x="368" y="222" class="body">Keep the active review alive</text></g>
<g><rect x="660" y="120" width="270" height="140" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="678" y="150" class="title">Inspect selection</text><text x="678" y="178" class="body">Validate exact folder identity</text><text x="678" y="200" class="body">Show selected path + access</text><text x="678" y="222" class="body">Replace the old suggestion</text></g>
<g><rect x="970" y="120" width="270" height="140" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="988" y="150" class="title">Owner approves</text><text x="988" y="178" class="body">Revalidate current request</text><text x="988" y="200" class="body">Store scoped folder grant</text><text x="988" y="222" class="body">Resume original conversation</text></g>
<path d="M310 190 H350" class="arrow"/><path d="M620 190 H660" class="arrow"/><path d="M930 190 H970" class="arrow"/>
<g><rect x="40" y="335" width="575" height="180" rx="15" fill="#fff2dd" stroke="#cbd4dd"/><text x="58" y="365" class="title">Reproduced bug</text><text x="58" y="393" class="body">A feed failure hid the approval window while its picker was open.</text><text x="58" y="415" class="body">The chosen path was then discarded as if the owner had cancelled.</text><text x="58" y="437" class="body">Fix: defer feed updates during the picker; report true interruptions.</text><text x="58" y="459" class="body">Cancellation remains cancellation. No access is silently granted.</text></g>
<g><rect x="665" y="335" width="575" height="180" rx="15" fill="#fff2dd" stroke="#cbd4dd"/><text x="683" y="365" class="title">Why the wrong folder appeared</text><text x="683" y="393" class="body">Dot reused an old MyOwnStack grant while debugging an Ability.</text><text x="683" y="415" class="body">Its identity check failed, then the model requested that name again.</text><text x="683" y="437" class="body">Fix: inspect runtime first; do not infer source from an old grant.</text><text x="683" y="459" class="body">The exact live picker interruption was not recorded.</text></g>
</svg>