<svg id="mouse-mover-execution-and-its-failure-points" xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="mouse-mover-execution-and-its-failure-points-title"><title id="mouse-mover-execution-and-its-failure-points-title">Mouse Mover execution and its failure points</title><defs><marker id="mouse-mover-execution-and-its-failure-points-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#637386"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17283c}.title{font-size:17px;font-weight:600}.body{font-size:14px}.label{font-size:13px;fill:#516277}#mouse-mover-execution-and-its-failure-points .arrow{fill:none;stroke:#637386;stroke-width:1.7;marker-end:url(#mouse-mover-execution-and-its-failure-points-arrow)}.heading{font-size:26px;font-weight:600}.sub{font-size:15px;fill:#516277}</style><rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="45" class="heading">Mouse Mover: a success receipt must reflect observed state</text>
<text x="40" y="75" class="sub">The worker cannot grant itself pointer access. The desktop owns the activity and its lease.</text>
<g><rect x="40" y="120" width="265" height="130" rx="15" fill="#eef2ff" stroke="#cbd4dd"/><text x="58" y="150" class="title">1 · AbilityService</text><text x="58" y="178" class="body">Bind Dot + thread + invocation</text><text x="58" y="200" class="body">Check install / grants / channel</text><text x="58" y="222" class="body">Record the execution receipt</text></g>
<g><rect x="345" y="120" width="265" height="130" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="363" y="150" class="title">2 · Desktop host</text><text x="363" y="178" class="body">Validate package and identity</text><text x="363" y="200" class="body">Run sealed Ability worker</text><text x="363" y="222" class="body">Validate capability requests</text></g>
<g><rect x="650" y="120" width="265" height="130" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="668" y="150" class="title">3 · Activity broker</text><text x="668" y="178" class="body">Admit explicit owner action</text><text x="668" y="200" class="body">Attach scoped activity lease</text><text x="668" y="222" class="body">Read trusted driver state</text></g>
<g><rect x="955" y="120" width="285" height="130" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="973" y="150" class="title">4 · Native driver</text><text x="973" y="178" class="body">Renderer frame → native move</text><text x="973" y="200" class="body">Observe acknowledgement</text><text x="973" y="222" class="body">Retire if authority is lost</text></g>
<path d="M305 185 H345" class="arrow"/><path d="M610 185 H650" class="arrow"/><path d="M915 185 H955" class="arrow"/>
<g><rect x="40" y="325" width="370" height="190" rx="15" fill="#fff2dd" stroke="#cbd4dd"/><text x="58" y="355" class="title">Observed gap: hidden state</text><text x="58" y="383" class="body">Worker returned generic success</text><text x="58" y="405" class="body">Running / paused / inactive stayed</text><text x="58" y="427" class="body">inside a private owner result card.</text><text x="58" y="449" class="body">Fix: safe host activity metadata;</text><text x="58" y="471" class="body">running requires movement ACK.</text></g>
<g><rect x="455" y="325" width="370" height="190" rx="15" fill="#fff2dd" stroke="#cbd4dd"/><text x="473" y="355" class="title">Reproduced timing failure</text><text x="473" y="383" class="body">AX window scans blocked main loop.</text><text x="473" y="405" class="body">Fake slow AX: ~650 ms blockage.</text><text x="473" y="427" class="body">Command deadline: 250 ms.</text><text x="473" y="449" class="body">Scene expiry: 500 ms.</text><text x="473" y="471" class="body">Fix: separate slow AX work.</text></g>
<g><rect x="870" y="325" width="370" height="190" rx="15" fill="#fff2dd" stroke="#cbd4dd"/><text x="888" y="355" class="title">Retirement / diagnosis</text><text x="888" y="383" class="body">Stale geometry made cleanup fail</text><text x="888" y="405" class="body">and could kill the native helper.</text><text x="888" y="427" class="body">Fix: retire by process identity;</text><text x="888" y="449" class="body">retain a bounded stop reason.</text><text x="888" y="471" class="body">A later status call can explain it.</text></g>
<path d="M1098 250 V292 H225 V325" class="arrow"/><text x="500" y="285" class="label">feedback to app → model</text>
<g><rect x="160" y="575" width="960" height="100" rx="15" fill="#e8f5ef" stroke="#cbd4dd"/><text x="178" y="605" class="title">What the model can now distinguish</text><text x="178" y="633" class="body">Approaching → movement not yet confirmed · Running → native movement acknowledged</text><text x="178" y="655" class="body">Paused → manual mouse use · Inactive → stopped, with an observed reason when known</text></g>
</svg>